<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品分類｜我的寫作基地</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">我的寫作基地 ✦</a>
            <div class="nav-search">
                <input type="text" id="searchInput" placeholder="搜尋作品或文章...">
                <div id="searchResults" class="search-dropdown"></div>
            </div>
            <div class="nav-links" id="navLinks">
                <a href="index.html">Home</a>
                <a href="works.html">Works</a>
                <a href="about.html">About</a>
                <button id="themeToggle" class="theme-btn" aria-label="切換深色模式">🌙</button>
            </div>
            <button class="menu-btn" id="menuBtn" aria-label="選單">☰</button>
        </div>
    </nav>

    <main class="container">
        <section class="works-page">
            <h2 class="section-title">作品分類</h2>
            <div class="category-filters" id="categoryFilters">
                <button class="filter-btn active" data-cat="all">全部</button>
                <button class="filter-btn" data-cat="連載">連載</button>
                <button class="filter-btn" data-cat="長篇小說">長篇小說</button>
                <button class="filter-btn" data-cat="短篇">短篇</button>
                <button class="filter-btn" data-cat="隨筆">隨筆</button>
            </div>
            <div id="worksList" class="card-grid">
                <!-- 由 JavaScript 產生 -->
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>我的寫作基地 © 2026</p>
        <p class="footer-note">正在慢慢寫完的故事們。</p>
    </footer>

    <script src="js/database.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
